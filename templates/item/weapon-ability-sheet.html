<form class="hollows-sheet" autocomplete="off">
  <header class="sheet-header">
    <div class="header-left">
      <input class="name" name="name" type="text" value="{{item.name}}" placeholder="Ability Name" />
      <div class="subline">Weapon Ability</div>
    </div>
  </header>

  <section class="sheet-section">
    <h2>Basics</h2>
    <div class="hollows-form-grid">
      <div class="hollows-form-row">
        <div class="stat-label">Weapon Type</div>
        <input type="text" name="system.weaponType" value="{{system.weaponType}}" />
      </div>
      <div class="hollows-form-row">
        <div class="stat-label">Tier</div>
        <input type="number" name="system.tier" value="{{system.tier}}" />
      </div>
      <div class="hollows-form-row">
        <div class="stat-label">Duration</div>
        <select name="system.durationType">
          <option value="permanent" {{#if (eq system.durationType "permanent")}}selected{{/if}}>Permanent</option>
          <option value="temporary" {{#if (eq system.durationType "temporary")}}selected{{/if}}>Temporary</option>
        </select>
      </div>
    </div>
  </section>

  <section class="sheet-section">
    <h2>Text</h2>
    <textarea name="system.text" rows="6">{{system.text}}</textarea>
  </section>

  <section class="sheet-section">
    <h2>Automation</h2>
    {{> "systems/hollows/templates/item/parts/script-controls.html"
        label="Script" action="editAbilityScript"
        block=system.script scriptsAllowed=scriptsAllowed}}
  </section>
</form>
